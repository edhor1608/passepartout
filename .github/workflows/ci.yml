name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    # ubuntu-26.04 ships FFmpeg 8, which shifts the white canvas to (253, 255, 253) in the border test.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Fast tests
        run: bun run test:fast
